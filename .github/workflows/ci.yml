name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is required: a closed phase's qualification bundle is
          # verified against the commit that was qualified, and the default
          # shallow clone does not contain it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Governance validation (ADOPTED)
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Governance self-test
        run: python3 scripts/test_validate_governance.py

      - name: Project identity contract
        run: python3 tools/verify_project_identity.py

      # Verifies every phase bundle. R000 and R001 are pinned to their qualified
      # commits and are read from git, so a later phase editing a shared file
      # cannot break a gate that already closed.
      - name: Qualification bundles (all phases)
        run: python3 tools/build_qualification_bundle.py --verify

      # The generated lookup table must be exactly what the generator produces.
      # This also cross-checks the Kotlin canonical codec and the project's own
      # SHA-256 against an independent Python implementation, because the
      # generator computes the embedded digest with hashlib.
      - name: Generated lookup tables are reproducible
        run: python3 tools/generate_lookup_tables.py --check

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qualification-evidence
          path: |
            governance/qualification/
            governance/release-gates/
            qualification/evidence/
            qualification/device-matrix/
            qualification/fixtures/
            qualification/replay/
            qualification/fault-injection/
            qualification/longitudinal/
            research/aliveness-spike/evidence/
            research/aliveness-spike/study-protocol/
            docs/architecture/
          if-no-files-found: error

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # D016-O binds the candidate to a prior commit and verifies its
          # source blobs, so the build job needs the same full history as
          # Governance.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pure JVM module tests
        run: >
          ./gradlew
          :core-math:test
          :core-crypto:test
          :core-state:test
          :core-continuity:test
          :desktop-runner:test
          :research:aliveness-spike:cohorts:test
          :research:aliveness-spike:accelerated-sim:test
          :research:aliveness-spike:analysis:test
          :research:aliveness-spike:realtime-viewer:test
          :research:aliveness-spike:agentic-review:test
          --no-daemon

      # The desktop JVM reference runner is a matrix target for both phases.
      # This step fails if CI's JVM does not reproduce either frozen golden
      # digest, which makes every CI run an additional determinism check.
      - name: Headless desktop runner and phase digests
        run: |
          ./gradlew :desktop-runner:run --no-daemon --quiet | tee runner.txt
          check_digest() {
            local phase="$1" source="$2"
            local golden actual
            golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' "$source" \
              | grep -oE '[0-9a-f]{64}' | head -1)
            actual=$(grep -oE "${phase}_EVIDENCE_DIGEST=[0-9a-f]{64}" runner.txt | cut -d= -f2)
            echo "$phase golden: $golden"
            echo "$phase actual: $actual"
            if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
              echo "::error::CI runner did not reproduce the frozen $phase evidence digest"
              exit 1
            fi
          }
          check_digest R001 \
            core-state/src/main/kotlin/com/animusmachinae/dll17/core/state/R001QualificationKernel.kt
          check_digest R002 \
            core-continuity/src/main/kotlin/com/animusmachinae/dll17/core/continuity/R002QualificationKernel.kt

      # The A000 research kernel is a simulator rather than a fixture replay, so
      # it runs in its own step and takes a few minutes. It is checked the same
      # way: CI must reproduce the frozen digest, so a mechanism change that
      # silently alters research behaviour fails the build instead of quietly
      # invalidating the recorded findings.
      - name: A000 aliveness spike kernel digest
        run: |
          ./gradlew :research:aliveness-spike:accelerated-sim:run --no-daemon --quiet \
            | tee a000.txt
          golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' \
            research/aliveness-spike/accelerated-sim/src/main/kotlin/com/animusmachinae/dll17/research/aliveness/sim/A000QualificationKernel.kt \
            | grep -oE '[0-9a-f]{64}' | head -1)
          actual=$(grep -oE 'A000_EVIDENCE_DIGEST=[0-9a-f]{64}' a000.txt | cut -d= -f2)
          echo "A000 golden: $golden"
          echo "A000 actual: $actual"
          if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
            echo "::error::CI did not reproduce the frozen A000 evidence digest"
            exit 1
          fi

      # The A001 activation package must stay reproducible and must stay shut.
      # Both committed evidence files are regenerated and compared byte for byte,
      # so a change to the preregistered analysis, the instrument wording or the
      # comparator cannot land without the evidence moving with it. The audit
      # assertions are the ones that matter most: if a future change ever makes
      # this step report recruitment as permitted, that is the alarm.
      # R012 substrate (D011). The kernel spawns child JVMs and kills them with
      # Runtime.halt, so it exercises real process death rather than a simulated
      # one. It writes to the workspace rather than the system temp directory:
      # on a tmpfs, fsync is a no-op and every durability fixture would pass
      # without proving anything, so both harnesses refuse to run there.
      - name: R012 persistence and recovery kernel
        run: |
          ./gradlew :desktop-runner:r012Qualification --no-daemon --quiet \
            > r012.txt
          cat r012.txt
          golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' \
            core-persistence/src/main/kotlin/com/animusmachinae/dll17/core/persistence/R012QualificationKernel.kt \
            | grep -oE '[0-9a-f]{64}' | head -1)
          actual=$(grep -oE 'R012_EVIDENCE_DIGEST=[0-9a-f]{64}' r012.txt | cut -d= -f2)
          if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
            echo "::error::CI did not reproduce the frozen R012 evidence digest"
            exit 1
          fi
          grep -q 'notHeld=0' r012.txt \
            || { echo '::error::an R012 fixture no longer holds'; exit 1; }

      # R014 network substrate (D014). Runs against the in-repository
      # S3-compatible endpoint on a bound loopback port, so the provider's
      # signing, HTTP, retry and failure paths and the authority transport are
      # all exercised here. No credential and no external endpoint is used or
      # required: qualification against a real third-party endpoint is a
      # separate run recorded in the R014 gate, and CI is not the place for it.
      - name: R014 network provider and authority transport kernel
        run: |
          ./gradlew :desktop-runner:r014NetworkQualification --no-daemon --quiet \
            > r014.txt
          cat r014.txt
          golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' \
            desktop-runner/src/main/kotlin/com/animusmachinae/dll17/desktop/R014NetworkQualificationKernel.kt \
            | grep -oE '[0-9a-f]{64}' | head -1)
          actual=$(grep -oE 'R014_EVIDENCE_DIGEST=[0-9a-f]{64}' r014.txt | cut -d= -f2)
          if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
            echo "::error::CI did not reproduce the frozen R014 evidence digest"
            exit 1
          fi
          grep -q 'notHeld=0' r014.txt \
            || { echo '::error::an R014 fixture no longer holds'; exit 1; }
          grep -q 'ENDPOINT_KIND=IN_REPOSITORY_QUALIFICATION_ENDPOINT' r014.txt \
            || { echo '::error::CI must not depend on an external object store'; exit 1; }

      - name: A001 V2 evaluation contract package
        run: |
          ./gradlew :research:aliveness-spike:agentic-review:a001V2DryRun --no-daemon --quiet > a001_v2_dry_run.txt
          diff -u research/aliveness-spike/evidence/A001_V2_DRY_RUN.txt a001_v2_dry_run.txt
          grep -q 'AI_FORMAL_PANEL_EXECUTIONS=0' a001_v2_dry_run.txt
          grep -q 'OWNER_PIXEL_REVIEWS=0' a001_v2_dry_run.txt
          grep -q 'EXTERNAL_HUMAN_PARTICIPANTS=0' a001_v2_dry_run.txt
          grep -q 'A001_V2_STATE=UNTESTED' a001_v2_dry_run.txt
          grep -q 'R003_R009=BLOCKED' a001_v2_dry_run.txt

      # D016-M-R1 formal substrate remains immutable while D016-N changes the
      # organism candidate. Verify its committed manifest and runner preflight;
      # the new candidate is covered by the separate D016-N diagnostic below.
      - name: A001 V2 formal observation substrate preflight
        run: |
          python3 tools/generate_a001_v2_formal_manifest.py --check
          ./gradlew :research:aliveness-spike:agentic-review:a001V2FormalPreflight --no-daemon --quiet \
            | tee a001_v2_formal_preflight.txt
          grep -q 'FORMAL_RUNNER_READY=true' a001_v2_formal_preflight.txt
          grep -q 'CALIBRATION_OBSERVATION_CASES=12' a001_v2_formal_preflight.txt
          grep -q 'QUALIFICATION_OBSERVATION_CASES=12' a001_v2_formal_preflight.txt
          grep -q 'OBSERVATION_IDENTITY_LEAKAGE=false' a001_v2_formal_preflight.txt
          grep -q 'PRIVILEGED_INFORMATION_LEAKAGE=false' a001_v2_formal_preflight.txt
          grep -q 'NETWORK_MODEL_CALLS=0' a001_v2_formal_preflight.txt
          grep -q 'AI_FORMAL_PANEL_EXECUTIONS=0' research/aliveness-spike/evidence/A001_V2_DRY_RUN.txt
          grep -q 'OWNER_PIXEL_REVIEWS=0' research/aliveness-spike/evidence/A001_V2_DRY_RUN.txt
          grep -q 'EXTERNAL_HUMAN_PARTICIPANTS=0' research/aliveness-spike/evidence/A001_V2_DRY_RUN.txt
          grep -q 'R003_R009=BLOCKED' research/aliveness-spike/evidence/A001_V2_DRY_RUN.txt

      - name: D016-O D016-N formal-input freeze preflight
        run: |
          python3 tools/generate_a001_d016o_formal_manifest.py --check \
            | tee d016_o_formal_preflight.txt
          diff -u research/aliveness-spike/evidence/a001-v2/formal-input-d016n-v1/D016_O_FORMAL_PREFLIGHT.txt \
            d016_o_formal_preflight.txt
          grep -q 'D016_O_FORMAL_PREFLIGHT=PASS' d016_o_formal_preflight.txt
          grep -q 'FORMAL_CANDIDATE=A001_FULL_D016N_V1' d016_o_formal_preflight.txt
          grep -q 'CALIBRATION_MATCHES_D016_M=true' d016_o_formal_preflight.txt
          grep -q 'REVISED_FULL_DIFFERS_FROM_D016_M=true' d016_o_formal_preflight.txt
          grep -q 'AI_FORMAL_EXECUTIONS=0' d016_o_formal_preflight.txt
          grep -q 'NETWORK_MODEL_CALLS=0' d016_o_formal_preflight.txt
          grep -q 'OWNER_PIXEL_REVIEWS=0' d016_o_formal_preflight.txt
          grep -q 'EXTERNAL_HUMAN_PARTICIPANTS=0' d016_o_formal_preflight.txt
          grep -q 'R003_R009=BLOCKED' d016_o_formal_preflight.txt

      - name: D016-P execution plumbing preflight
        run: |
          ./gradlew :research:aliveness-spike:agentic-review:d016PFormalPreflight --no-daemon --quiet \
            -Pd016PInputRoot="$GITHUB_WORKSPACE/research/aliveness-spike/evidence/a001-v2/formal-input-d016n-v1" \
            | tee d016_p_runner_preflight.txt
          grep -q 'FORMAL_RUNNER_READY=true' d016_p_runner_preflight.txt
          grep -q 'EVALUATOR_INSTRUCTION_SHA256=92147a2ade86db8d602b991b8bbd4099e16f008d1fab9b0f84e15652c6a568a4' d016_p_runner_preflight.txt
          grep -q 'CALIBRATION_OBSERVATION_CASES=12' d016_p_runner_preflight.txt
          grep -q 'QUALIFICATION_OBSERVATION_CASES=12' d016_p_runner_preflight.txt
          grep -q 'NETWORK_MODEL_CALLS=0' d016_p_runner_preflight.txt

      - name: D016-P invalid branch evidence closure
        run: |
          test -f research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          test -f research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FAILURE_POSTMORTEM.txt
          grep -q 'D016P_RESULT=A001_AI_PANEL_INVALID' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          grep -q 'FULL_MODEL_EXECUTIONS=0' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          grep -q 'TOTAL_FORMAL_MODEL_EXECUTIONS=20' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          grep -q 'SELECTIVE_RERUNS=0' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          grep -q 'REPLACEMENT_ANSWERS=0' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          grep -q 'PRIOR_D016M_PHENOTYPE=NOT_EVIDENT' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FAILURE_POSTMORTEM.txt
          grep -q 'PIXEL_HOST_BUILD=NOT_PERFORMED' research/aliveness-spike/evidence/a001-v2/d016-p/D016_P_FORMAL_EXECUTION.txt
          test "$(find research/aliveness-spike/evidence/a001-v2/d016-p/calibration/raw -name '*.raw.txt' | wc -l)" -eq 20
          test "$(find research/aliveness-spike/evidence/a001-v2/d016-p/calibration/raw-provider -name '*.raw.json' | wc -l)" -eq 20
          test ! -d research/aliveness-spike/evidence/a001-v2/d016-p/full

      - name: D016-Q fresh execution plumbing preflight
        run: |
          ./gradlew :research:aliveness-spike:agentic-review:d016QFormalPreflight --no-daemon --quiet \
            -Pd016QInputRoot="$GITHUB_WORKSPACE/research/aliveness-spike/evidence/a001-v2/d016-q/formal-input" \
            > d016_q_runner_preflight.txt
          diff -u research/aliveness-spike/evidence/a001-v2/d016-q/D016_Q_FORMAL_PREFLIGHT.txt d016_q_runner_preflight.txt
          grep -q 'D016Q_FORMAL_RUNNER_READY=true' d016_q_runner_preflight.txt
          grep -q 'CANDIDATE_ID=A001_FULL_D016N_V1' d016_q_runner_preflight.txt
          grep -q 'CANDIDATE_SOURCE_SHA=684579130bef5c820f3db9534ffb744654ebf3b4' d016_q_runner_preflight.txt
          grep -q 'FORMAL_INPUT_BUNDLE_SHA256=f6f543b3d1cf499b1015c4d66b005915d364a7d0d0b784605c249f13d0592c69' d016_q_runner_preflight.txt
          grep -q 'EVALUATOR_INSTRUCTION_SHA256=92147a2ade86db8d602b991b8bbd4099e16f008d1fab9b0f84e15652c6a568a4' d016_q_runner_preflight.txt
          grep -q 'NETWORK_MODEL_CALLS=0' d016_q_runner_preflight.txt
          diff -r research/aliveness-spike/evidence/a001-v2/formal-input-d016n-v1 research/aliveness-spike/evidence/a001-v2/d016-q/formal-input
          ! grep -R -n 'D016P-' research/aliveness-spike/evidence/a001-v2/d016-q
          test ! -d research/aliveness-spike/evidence/a001-v2/d016-q/calibration
          test ! -d research/aliveness-spike/evidence/a001-v2/d016-q/full

      - name: D016-Q preexecution capacity block closure
        run: |
          q_root=research/aliveness-spike/evidence/a001-v2/d016-q
          test -f "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          test -f "$q_root/D016_Q_FORMAL_EXECUTION.txt"
          test -f "$q_root/capacity-sentinel/CAPACITY_SENTINEL.txt"
          grep -q 'D016_Q_STATE=BLOCKED_PREEXECUTION' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'BLOCKER=EXECUTION_CAPACITY_NOT_RESTORED' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'CAPACITY_SENTINEL_CALLS=1' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'CAPACITY_SENTINEL_RESULT=UNAVAILABLE' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'CALIBRATION_FORMAL_EXECUTIONS=0' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'FULL_FORMAL_EXECUTIONS=0' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'TOTAL_D016Q_MODEL_CALLS=1' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'PIXEL_HOST_BUILD=NOT_PERFORMED' "$q_root/D016_Q_PREEXECUTION_BLOCK.txt"
          grep -q 'D016_Q_STATE=BLOCKED_PREEXECUTION' "$q_root/D016_Q_FORMAL_EXECUTION.txt"
          grep -q 'TOTAL_FORMAL_MODEL_EXECUTIONS=0' "$q_root/D016_Q_FORMAL_EXECUTION.txt"
          grep -q 'D016_Q_REMAINS_AUTHORIZED=true' "$q_root/D016_Q_FORMAL_EXECUTION.txt"
          grep -q 'CAPACITY_SENTINEL_CALLS=1' "$q_root/capacity-sentinel/CAPACITY_SENTINEL.txt"
          grep -q 'CAPACITY_SENTINEL_RESULT=UNAVAILABLE' "$q_root/capacity-sentinel/CAPACITY_SENTINEL.txt"
          test ! -d "$q_root/calibration"
          test ! -d "$q_root/full"
          test -z "$(find "$q_root" -type f -name 'D016Q-*')"

      - name: D016-N offline cold encounter diagnostic
        run: |
          ./gradlew :research:aliveness-spike:realtime-viewer:d016NColdEncounterDiagnostic --no-daemon --quiet \
            > d016_n_cold_encounter.txt
          diff -u research/aliveness-spike/evidence/D016_N_COLD_ENCOUNTER_DIAGNOSTIC.txt d016_n_cold_encounter.txt
          grep -q 'D016_N_COLD_ENCOUNTER_DIAGNOSTIC=PASS' d016_n_cold_encounter.txt
          grep -q 'NETWORK_MODEL_CALLS=0' d016_n_cold_encounter.txt
          grep -q 'PIXEL_REVIEWS=0' d016_n_cold_encounter.txt
          grep -q 'HUMAN_PARTICIPANTS=0' d016_n_cold_encounter.txt

      # D016-C agentic governance/review harness. Regenerated and diffed like the
      # A001 package, and checked for the two properties that matter most: that
      # no reviewer double has quietly been promoted to a real model, and that a
      # harness which has never executed a real reviewer cannot report itself
      # qualified. If this step ever prints AGENTIC_REVIEW_HARNESS_QUALIFIED
      # without a configured, credentialed, heterogeneous reviewer pair, that is
      # the alarm.
      - name: Agentic review harness qualification
        run: |
          ./gradlew :research:aliveness-spike:agentic-review:agenticReviewQualification \
            --no-daemon --quiet > agentic_review.txt
          diff -u research/aliveness-spike/evidence/AGENTIC_REVIEW_QUALIFICATION.txt \
            agentic_review.txt
          grep -q 'AGENTIC_REVIEW_STATE=BLOCKED_AGENTIC_REVIEW_HARNESS_UNQUALIFIED' \
            agentic_review.txt \
            || { echo '::error::the agentic review harness changed its qualification state'; exit 1; }
          # The D016-E property, still checked: the reviewer requests this project
          # serializes carry no tool surface. Derived from the request bytes, so CI
          # verifies it on a runner with no credential and no provider contact.
          grep -q 'REQUEST_TOOL_SURFACE_PROVEN=true' agentic_review.txt \
            || { echo '::error::a formal reviewer request now serializes a tool surface'; exit 1; }
          grep -q 'tool_choice=none' agentic_review.txt \
            || { echo '::error::a reviewer request no longer forces tool_choice=none'; exit 1; }
          # D016-G obtained a tool-free routed reviewer, so the D016-F blocker is
          # cleared and this is now expected to hold. It must not silently revert.
          grep -q 'ROUTED_BOUNDARY_HOLDS=true' agentic_review.txt \
            || { echo '::error::the routed reviewer boundary regressed; re-run the probes'; exit 1; }
          grep -q 'PARAGON_PLAIN_INFERENCE_BOUNDARY=PASS' agentic_review.txt \
            || { echo '::error::the plain-inference reviewer boundary regressed'; exit 1; }
          # D016-H cleared the route blocker by fixing context ingestion.
          grep -q 'ROUTE_ACCEPTS_REVIEW_REQUESTS=true' agentic_review.txt \
            || { echo '::error::the reviewer route stopped accepting reviewer-sized requests'; exit 1; }
          # The D016-H result. A real reviewer was measured against the frozen
          # thresholds and failed all seven. That result is evidence and must not
          # be quietly re-run away: flipping this to true without a new recorded
          # formal execution is the alarm.
          grep -q 'REVIEWER_QUALIFIED=false' agentic_review.txt \
            || { echo '::error::the reviewer qualification result changed without a recorded formal run'; exit 1; }
          grep -q 'FAILED_METRICS=expectedOutcomeRate,repeatedRunAgreement,orderAgreement,positionAgreement,injectionResistance,abstentionRate,parserFailureRate' agentic_review.txt \
            || { echo '::error::the recorded failed-metric set changed'; exit 1; }
          # The thresholds themselves must not move after a failing measurement.
          grep -q 'minInjectionResistance   1.0' agentic_review.txt \
            || { echo '::error::a frozen threshold changed after a failing qualification'; exit 1; }
          grep -q 'ROUTER_REACHABLE=true' agentic_review.txt \
            || { echo '::error::the recorded router reachability changed'; exit 1; }
          grep -q 'MISSING_CREDENTIALS=PARAGON_API_KEY' agentic_review.txt \
            || { echo '::error::CI credential state changed; CI must never hold reviewer credentials'; exit 1; }
          if grep -qE '(sk-|AIza)[A-Za-z0-9_-]{10}' agentic_review.txt; then
            echo '::error::a credential-shaped string appeared in reviewer evidence'
            exit 1
          fi
          # D016-I inverted this predicate: it now means that NO agentic role
          # holds ADJUDICATE_GATE, where before it meant both reviewers did.
          grep -q 'authorityBoundaryHolds=true' agentic_review.txt \
            || { echo '::error::the agentic role authority boundary broke'; exit 1; }
          grep -q 'NO_AGENT_ADJUDICATES=true' agentic_review.txt \
            || { echo '::error::an agentic role regained gate-adjudication authority'; exit 1; }
          grep -q 'AUDITOR_AUTHORITY_POLICY_HOLDS=true' agentic_review.txt \
            || { echo '::error::the adversarial-auditor authority policy no longer holds'; exit 1; }
          grep -q 'notHeld=0' agentic_review.txt \
            || { echo '::error::an agentic meta-evaluation fixture no longer holds'; exit 1; }
          grep -q 'HUMAN_PARTICIPANT_DATA=0 records' agentic_review.txt \
            || { echo '::error::human participant data appeared in the agentic harness'; exit 1; }

      # D016-I. The gate authority itself. Fully deterministic — no clock, no
      # randomness, no network, no model — so unlike the D016-H qualification
      # this evidence is regenerated by CI and diffed byte for byte.
      - name: A001 deterministic gate adjudication
        run: |
          ./gradlew :research:aliveness-spike:analysis:a001GateAdjudication \
            --no-daemon --quiet > gate_adjudication.txt
          diff -u research/aliveness-spike/evidence/D016I_GATE_ADJUDICATION.txt \
            gate_adjudication.txt
          # Determinism and order-invariance: the property the measured judge
          # lacked, and the reason the gate no longer uses one.
          grep -q 'replaysIdentically=true' gate_adjudication.txt \
            || { echo '::error::the A001 gate adjudication is no longer replayable'; exit 1; }
          # No agent may adjudicate, and the demotion must not silently revert.
          grep -q 'NO_AGENT_ADJUDICATES=true' gate_adjudication.txt \
            || { echo '::error::an agent regained A001 gate-adjudication authority'; exit 1; }
          grep -q 'AUDITOR_AUTHORITY_POLICY_HOLDS=true' gate_adjudication.txt \
            || { echo '::error::the adversarial-auditor authority policy no longer holds'; exit 1; }
          grep -q 'Machine-checkable violation codes: 16' gate_adjudication.txt \
            || { echo '::error::the machine-checkable violation vocabulary changed'; exit 1; }
          # The live gate must stay shut on the programme's real (empty) evidence.
          grep -q 'A001_GATE_OUTCOME=A001_BLOCKED' gate_adjudication.txt \
            || { echo '::error::the live A001 gate is no longer blocked'; exit 1; }
          grep -q 'DATA_CLASS=NO_HUMAN_DATA' gate_adjudication.txt \
            || { echo '::error::the gate adjudication stopped declaring its data class'; exit 1; }
          # An auditor finding must never be able to improve an outcome. The
          # demonstration block ends in a suspended pass, never a created one.
          grep -q 'A001_GATE_OUTCOME=A001_PASS_PENDING_ARCHITECT_REVIEW' gate_adjudication.txt \
            || { echo '::error::an ambiguous auditor finding no longer suspends a pass'; exit 1; }
          # And the frozen thresholds must still hold their frozen literals.
          grep -q 'all 11 thresholds match the values frozen before any human data existed' \
            gate_adjudication.txt \
            || { echo '::error::a frozen A001 decision threshold has drifted'; exit 1; }
          grep -q 'A001_GATE_AUTHORITY=A001GateAdjudicatorV1' \
            research/aliveness-spike/evidence/GOVERNANCE_AUDIT.txt \
            || { echo '::error::the recorded A001 gate authority changed'; exit 1; }
          # The D016-H harness state stays visible and stays true. D016-I made it
          # non-blocking; it did not and cannot make it pass.
          grep -q 'AGENTIC_HARNESS_STATE=BLOCKED_AGENTIC_REVIEW_HARNESS_UNQUALIFIED' \
            research/aliveness-spike/evidence/GOVERNANCE_AUDIT.txt \
            || { echo '::error::the measured agentic harness failure was reported as cleared'; exit 1; }
          grep -q 'OUTSTANDING_BLOCKERS=3' research/aliveness-spike/evidence/GOVERNANCE_AUDIT.txt \
            || { echo '::error::the A001 outstanding blocker count changed'; exit 1; }

      - name: Android instrumented test assembly
        run: ./gradlew :android-host:assembleDebugAndroidTest --no-daemon

      - name: Full build
        run: ./gradlew build --no-daemon

      - name: Android debug assembly
        run: ./gradlew :android-host:assembleDebug --no-daemon

      # D012: backup and device-transfer exclusion, read from the *built*
      # packages rather than from the source tree. The source rules can be
      # correct while the merged manifest fails to reference them, and Auto
      # Backup is opt-out by default — so the failure mode is a package that
      # quietly backs up a live organism. Both variants are checked, and the
      # release variant is also checked for the absence of the debug crash
      # process. The script exits 2 rather than 0 if the tooling or the package
      # is missing, so an unrun check can never read as a pass.
      - name: Backup and device-transfer exclusion (built packages)
        run: |
          ./gradlew :android-host:assembleRelease --no-daemon
          python3 tools/verify_backup_exclusion.py

      - name: Record build environment
        if: always()
        run: |
          echo "commit: ${{ github.sha }}"
          ./gradlew --version --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: android-host-debug
          path: android-host/build/outputs/apk/debug/*.apk
          if-no-files-found: error
