name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is required: a closed phase's qualification bundle is
          # verified against the commit that was qualified, and the default
          # shallow clone does not contain it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Governance validation (ADOPTED)
        run: python3 scripts/validate_governance.py --mode ADOPTED

      - name: Governance self-test
        run: python3 scripts/test_validate_governance.py

      - name: Project identity contract
        run: python3 tools/verify_project_identity.py

      # Verifies every phase bundle. R000 and R001 are pinned to their qualified
      # commits and are read from git, so a later phase editing a shared file
      # cannot break a gate that already closed.
      - name: Qualification bundles (all phases)
        run: python3 tools/build_qualification_bundle.py --verify

      # The generated lookup table must be exactly what the generator produces.
      # This also cross-checks the Kotlin canonical codec and the project's own
      # SHA-256 against an independent Python implementation, because the
      # generator computes the embedded digest with hashlib.
      - name: Generated lookup tables are reproducible
        run: python3 tools/generate_lookup_tables.py --check

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qualification-evidence
          path: |
            governance/qualification/
            governance/release-gates/
            qualification/evidence/
            qualification/device-matrix/
            qualification/fixtures/
            qualification/replay/
            qualification/fault-injection/
            qualification/longitudinal/
            research/aliveness-spike/evidence/
            research/aliveness-spike/study-protocol/
          if-no-files-found: error

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Pure JVM module tests
        run: >
          ./gradlew
          :core-math:test
          :core-crypto:test
          :core-state:test
          :core-continuity:test
          :desktop-runner:test
          :research:aliveness-spike:cohorts:test
          :research:aliveness-spike:accelerated-sim:test
          :research:aliveness-spike:analysis:test
          :research:aliveness-spike:realtime-viewer:test
          --no-daemon

      # The desktop JVM reference runner is a matrix target for both phases.
      # This step fails if CI's JVM does not reproduce either frozen golden
      # digest, which makes every CI run an additional determinism check.
      - name: Headless desktop runner and phase digests
        run: |
          ./gradlew :desktop-runner:run --no-daemon --quiet | tee runner.txt
          check_digest() {
            local phase="$1" source="$2"
            local golden actual
            golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' "$source" \
              | grep -oE '[0-9a-f]{64}' | head -1)
            actual=$(grep -oE "${phase}_EVIDENCE_DIGEST=[0-9a-f]{64}" runner.txt | cut -d= -f2)
            echo "$phase golden: $golden"
            echo "$phase actual: $actual"
            if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
              echo "::error::CI runner did not reproduce the frozen $phase evidence digest"
              exit 1
            fi
          }
          check_digest R001 \
            core-state/src/main/kotlin/com/animusmachinae/dll17/core/state/R001QualificationKernel.kt
          check_digest R002 \
            core-continuity/src/main/kotlin/com/animusmachinae/dll17/core/continuity/R002QualificationKernel.kt

      # The A000 research kernel is a simulator rather than a fixture replay, so
      # it runs in its own step and takes a few minutes. It is checked the same
      # way: CI must reproduce the frozen digest, so a mechanism change that
      # silently alters research behaviour fails the build instead of quietly
      # invalidating the recorded findings.
      - name: A000 aliveness spike kernel digest
        run: |
          ./gradlew :research:aliveness-spike:accelerated-sim:run --no-daemon --quiet \
            | tee a000.txt
          golden=$(grep -A1 'GOLDEN_EVIDENCE_DIGEST: String' \
            research/aliveness-spike/accelerated-sim/src/main/kotlin/com/animusmachinae/dll17/research/aliveness/sim/A000QualificationKernel.kt \
            | grep -oE '[0-9a-f]{64}' | head -1)
          actual=$(grep -oE 'A000_EVIDENCE_DIGEST=[0-9a-f]{64}' a000.txt | cut -d= -f2)
          echo "A000 golden: $golden"
          echo "A000 actual: $actual"
          if [ -z "$golden" ] || [ "$golden" != "$actual" ]; then
            echo "::error::CI did not reproduce the frozen A000 evidence digest"
            exit 1
          fi

      - name: Android instrumented test assembly
        run: ./gradlew :android-host:assembleDebugAndroidTest --no-daemon

      - name: Full build
        run: ./gradlew build --no-daemon

      - name: Android debug assembly
        run: ./gradlew :android-host:assembleDebug --no-daemon

      - name: Record build environment
        if: always()
        run: |
          echo "commit: ${{ github.sha }}"
          ./gradlew --version --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: android-host-debug
          path: android-host/build/outputs/apk/debug/*.apk
          if-no-files-found: error
